<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Student Records System</title>
</head>
<body>
<main>
  <h1>Student Records System</h1>
  <p>Class demonstration. Fictional records only.</p>
  <form id="login">
    <h2>Operator sign in</h2>
    <label>Email <input id="email" type="email" required /></label>
    <label>Password <input id="password" type="password" required /></label>
    <button>Sign in</button>
    <button id="register" type="button">Register</button>
  </form>
  <p id="auth-message" role="status"></p>
  <section id="app" hidden>
    <button id="logout" type="button">Sign out</button>
    <h2>Add or edit a student</h2>
    <form id="student-form">
      <input id="student-id" type="hidden" />
      <label>Student number <input id="student-no" required /></label>
      <label>First name <input id="first-name" required /></label>
      <label>Last name <input id="last-name" required /></label>
      <label>Year level
        <input id="year" type="number" min="1" max="4" required />
      </label>
      <label>Student email
        <input id="student-email" type="email" required />
      </label>
      <label>Course <select id="course" required></select></label>
      <button>Save student</button>
      <button id="clear" type="button">Clear form</button>
    </form>
    <p id="message" role="status"></p>
    <h2>Student list</h2>
    <label>Search name or student number <input id="search" /></label>
    <button id="refresh" type="button">Refresh list</button>
    <ul id="list"></ul>
    <h2>Course report</h2>
    <p>Choose a course above, then click Count students.</p>
    <button id="count" type="button">Count students</button>
    <p id="report" role="status"></p>
  </section>
</main>
<script type="module" src="/src/main.js"></script>
</body>
</html>
